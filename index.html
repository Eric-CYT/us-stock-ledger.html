<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">

<title>美股帳本</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231baf7a'/%3E%3Cpath d='M6 16l4-5 3 3 5-7' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10);
  --hover: rgba(11, 11, 11, 0.05);
  --accent: #256abf; --accent-ink: #ffffff;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
  --c-other: #a9a8a1;
  --txt-red: #d03b3b; --txt-green: #006300;
  --danger: #d03b3b; --st-good: #0ca30c; --st-warn: #fab219; --st-bad: #d03b3b;
  --col-avgcost: #2a78d6; --col-costamt: #a16207;
  --cost-fill: #ffffff; --cost-stroke: #8f8e88;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.07);
    --accent: #3987e5; --accent-ink: #0b0b0b;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --col-avgcost: #5b9cf0; --col-costamt: #eab308;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --c-other: #5a5a56;
    --txt-red: #e66767; --txt-green: #0ca30c; --danger: #e66767;
    --cost-fill: #ffffff; --cost-stroke: transparent;
  }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.07);
    --accent: #3987e5; --accent-ink: #0b0b0b;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --col-avgcost: #5b9cf0; --col-costamt: #eab308;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --c-other: #5a5a56;
    --txt-red: #e66767; --txt-green: #0ca30c; --danger: #e66767;
    --cost-fill: #ffffff; --cost-stroke: transparent;
}

:root[data-ud="red-up"] { --gain: var(--txt-red); --loss: var(--txt-green); }
:root[data-ud="green-up"] { --gain: var(--txt-green); --loss: var(--txt-red); }
:root:not([data-ud]) { --gain: var(--txt-red); --loss: var(--txt-green); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
.muted { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
.gain { color: var(--gain); }
.loss { color: var(--loss); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 版面 ---------- */
.page { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 16px 0 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 650; margin-right: auto; }
.brand svg { flex: none; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.status.ok .dot { background: var(--st-good); }
.status.loading .dot { background: var(--st-warn); }
.status.error .dot { background: var(--st-bad); }
.tools { display: flex; gap: 6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 6px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--border); background: var(--surface); font-weight: 550;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: transparent; }
.btn.icon { width: 36px; padding: 0; }
.btn.small { min-height: 28px; padding: 2px 10px; font-size: 13px; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; min-height: 0; text-decoration: underline; font-weight: 500; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.is-loading { opacity: 0.6; transition: opacity 0.15s; }

.filters { display: flex; flex-wrap: wrap; gap: 12px 24px; padding: 8px 0 16px; align-items: flex-end; }
.fgroup { display: flex; flex-direction: column; gap: 4px; }
.flabel { font-size: 12px; color: var(--ink-2); }
.segctl { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 2px; gap: 2px; }
.segctl button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; min-height: 30px; white-space: nowrap; color: var(--ink-2); }
.segctl button:hover { background: var(--hover); }
.segctl button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h2 { font-size: 16px; font-weight: 650; margin-right: auto; }
.card-sub { font-size: 12.5px; color: var(--ink-2); }
.foot { font-size: 12px; color: var(--ink-2); margin-top: 8px; }

.notice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border); border-left: 4px solid var(--st-warn);
  border-radius: 8px; background: var(--surface); padding: 10px 12px; margin-bottom: 10px; font-size: 13.5px; }
.notice svg { flex: none; margin-top: 2px; color: var(--ink-2); }
.notice .grow { flex: 1; }

/* ---------- 摘要 ---------- */
.hero-label { font-size: 13px; color: var(--ink-2); }
.hero-value { font-size: clamp(2.5rem, 7vw, 3.5rem); font-weight: 650; line-height: 1.1; margin: 4px 0; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.hero-value .unit { font-size: 0.35em; font-weight: 500; color: var(--ink-2); margin-left: 8px; letter-spacing: 0; }
.hero-delta { font-size: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 16px; }
.tile { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .t-label { font-size: 12.5px; color: var(--ink-2); }
.tile .t-value { font-size: 22px; font-weight: 650; margin-top: 2px; overflow-wrap: anywhere; }
.tile .t-sub { font-size: 12.5px; margin-top: 2px; color: var(--ink-2); }

.empty { text-align: center; padding: 40px 16px; }
.empty h2 { font-size: 20px; margin-bottom: 8px; }
.empty p { color: var(--ink-2); margin-bottom: 16px; max-width: 46ch; margin-inline: auto; }

/* ---------- 圖表 ---------- */
.chart-body { min-height: 296px; }
.bars-body.chartmode { min-height: 344px; }
.chart-body.placeholder { display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
.legend { display: flex; gap: 16px; font-size: 13px; margin-bottom: 6px; color: var(--ink-2); }
.legend.wrap { flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; }
.lg-item { display: inline-flex; align-items: center; gap: 6px; }
.lg-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.lg-box { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
svg.chart, svg.alloc { display: block; width: 100%; height: auto; max-width: 100%; }
.chart:focus-visible { outline-offset: 4px; border-radius: 4px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .endlabel { fill: var(--ink); font-size: 12px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; font-variant-numeric: tabular-nums; }
.chart .cross { stroke: var(--axis); stroke-width: 1; }
.chart .overlay { fill: transparent; touch-action: pan-y; cursor: crosshair; }
.chart .bar.cost { fill: var(--cost-fill); stroke: var(--cost-stroke); stroke-width: 1; }
.chart .bar.profit { fill: var(--st-good); }
.chart .bar.loss { fill: var(--st-bad); }
.chart .bargrp { transition: opacity 0.12s; }
.chart .bargrp.hot { opacity: 0.78; }
.chart .vlabel { fill: var(--ink); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart .xlabel { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
.chart .hit { fill: transparent; }
.chart .hit:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2; }
.lg-box.cost { background: var(--cost-fill); border: 1px solid var(--cost-stroke); }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.mini { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px 6px; min-width: 0; }
.mini-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; flex-wrap: wrap; }
.mini-head .asset { margin-right: auto; }
.mini-val { font-weight: 650; }
.mini-pnl { font-size: 12.5px; }
.mini-body { min-height: 200px; }
.mini-body.placeholder { display: flex; align-items: center; justify-content: center; color: var(--ink-2); font-size: 13px; }
.p-good { color: var(--txt-green); }
.p-bad { color: var(--txt-red); }
.alloc .seg { transition: filter 0.12s; }
.alloc .seg.hot { filter: brightness(1.12); }
.alloc .hit { fill: transparent; }
.alloc .hit:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2; }

.tip { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 170px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18); }
.tip[hidden] { display: none; }
.tip-head { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
.tip-key { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.tip-key.none { background: none; }
.tip-label { color: var(--ink-2); margin-right: auto; }
.tip-val { font-variant-numeric: tabular-nums; }
.tip-val.strong { font-weight: 650; }

/* ---------- 表格 ---------- */
.col-avgcost { color: var(--col-avgcost); font-weight: 600; }
.col-costamt { color: var(--col-costamt); font-weight: 600; }
.col-expprofit { color: var(--col-costamt); font-weight: 600; }
.tgt-input { width: 11em; min-height: 40px; padding: 8px 10px; font-size: 15px; }
.tgt-input::placeholder { color: var(--ink-3); }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: right; font-weight: 500; color: var(--ink-2); font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; vertical-align: middle; }
th:first-child, td:first-child { text-align: left; }
th.l, td.l { text-align: left; }
tfoot td { font-weight: 650; border-bottom: 0; }
tbody tr:hover { background: var(--hover); }
.asset { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.badge { font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--ink-2); }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 4px; }
.tag.buy { background: color-mix(in srgb, var(--c1) 14%, transparent); }
.tag.sell { background: color-mix(in srgb, var(--c2) 18%, transparent); }
.note { max-width: 14ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
td.act { white-space: nowrap; }
tr.bad td { background: color-mix(in srgb, var(--st-bad) 8%, transparent); }
.txbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
select, input[type="text"], input[type="number"], input[type="datetime-local"], input[type="password"] {
  min-height: 36px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); width: 100%;
}
.card-head select { width: auto; min-width: 9em; }
.inline input { flex: 1; min-width: 0; }
.hint { font-size: 12.5px; }

/* ---------- 對話框 ---------- */
dialog.dlg { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0;
  width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
dialog.dlg::backdrop { background: rgba(0, 0, 0, 0.5); }
.dlg-in { padding: 20px; }
.dlg h2 { font-size: 18px; margin-bottom: 4px; }
.dlg .lead { color: var(--ink-2); font-size: 13.5px; margin-bottom: 14px; }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field > label, .field > .flabel { font-size: 13px; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--ink-2); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.inline { display: flex; gap: 8px; align-items: center; }
.err { color: var(--danger); font-size: 13px; min-height: 1.2em; margin-top: 6px; }
.sec { border-top: 1px solid var(--grid); padding-top: 14px; margin-top: 14px; }
.sec h3 { font-size: 14px; margin-bottom: 8px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.total-line { font-size: 13px; color: var(--ink-2); margin: -4px 0 10px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 16px; border-radius: 999px; font-size: 13.5px; z-index: 200; max-width: calc(100vw - 32px); }

/* ---------- 鎖定畫面 ---------- */
.lock { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.lock-card { width: min(360px, 100%); text-align: center; }
.lock-card h1 { font-size: 22px; margin: 12px 0 4px; }
.lock-sub { color: var(--ink-2); margin-bottom: 20px; min-height: 1.5em; }
.pin-dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 8px; }
.pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink-3); }
.pin-dot.on { background: var(--ink); border-color: var(--ink); }
.pin-dots.shake { animation: shake 0.35s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.lock-msg { min-height: 1.6em; font-size: 13.5px; color: var(--ink-2); margin-bottom: 12px; }
.lock-msg.err { color: var(--danger); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 280px; margin: 0 auto 16px; }
.key { width: 72px; height: 72px; justify-self: center; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
.key:hover { background: var(--hover); }
.key:active { background: var(--axis); }
.key.util { font-size: 13px; color: var(--ink-2); }
.key[disabled] { opacity: 0.4; cursor: default; }
.lock-foot { font-size: 12px; color: var(--ink-2); margin-top: 8px; }

/* ---------- 手機：表格改卡片 ---------- */
@media (max-width: 760px) {
  .card { padding: 14px 12px; }
  table.rt thead { display: none; }
  table.rt, table.rt tbody, table.rt tr, table.rt td, table.rt tfoot { display: block; width: 100%; }
  table.rt tr { border: 1px solid var(--grid); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  table.rt td { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; padding: 3px 0; text-align: right; }
  table.rt td::before { content: attr(data-label); color: var(--ink-2); font-size: 12.5px; text-align: left; flex: none; }
  table.rt td:first-child { font-size: 15px; padding-bottom: 6px; }
  table.rt td:first-child::before { content: none; }
  table.rt td.act { justify-content: flex-end; }
  table.rt td.act::before { content: none; }
  table.rt .note { max-width: 60%; }
  table.rt td.tgt-cell { flex-direction: column; align-items: stretch; gap: 6px; }
  table.rt td.tgt-cell .tgt-input { width: 100%; }
  table.rt tfoot tr { background: var(--hover); }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.holdings tfoot td, table tfoot td{white-space:nowrap}

/* ---------- 篩選 / 排序列、可排序表頭 ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar[hidden], .toolbar .btn[hidden] { display: none; }
.toolbar select, .toolbar input { width: auto; min-width: 0; }
.toolbar input.q { flex: 1 1 11em; max-width: 18em; }
.toolbar .dlab { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.toolbar input[type="date"] { min-height: 36px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); }
.thsort { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.thsort:hover { color: var(--ink); text-decoration: underline; }
.thsort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.thsort.on { color: var(--ink); font-weight: 650; }
.sarr { font-size: 12px; }

/* ---------- 調整版面對話框 ---------- */
.order-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.order-item { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; background: var(--surface); }
.order-item .oname { margin-right: auto; font-weight: 550; }
.order-item .grip { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; cursor: grab; color: var(--ink-2); touch-action: none; user-select: none; border-radius: 6px; }
.order-item .grip:hover { background: var(--hover); }
.order-item.dragging { background: var(--hover); border-color: var(--accent); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.order-item.dragging .grip { cursor: grabbing; }
@media (max-width: 760px) {
  .toolbar .dlab { flex: 1 1 42%; }
  .toolbar .dlab input { flex: 1; min-width: 0; }
  .toolbar select { flex: 1 1 8em; }
}

/* ---------- 雲端同步 ---------- */
.syncchip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.syncchip[hidden] { display: none; }
.syncchip.ok { color: var(--ink-2); }
.syncchip.syncing svg { animation: spin 1s linear infinite; }
.syncchip.pending { color: var(--ink-2); font-style: italic; }
.syncchip.error { color: var(--danger); border-color: var(--danger); }
@keyframes spin { to { transform: rotate(360deg); } }
.howto { margin: 6px 0 12px; font-size: 13px; color: var(--ink-2); }
.howto summary { cursor: pointer; color: var(--accent); }
.howto ol { margin: 8px 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 6px; }

<script>
/* ===== util.js ===== */
/* ------------------------------------------------------------------
 * Util：DOM 建構、格式化、刻度計算。所有使用者資料一律以 textContent 寫入。
 * ------------------------------------------------------------------ */
const SVG_NS = 'http://www.w3.org/2000/svg';

function h(tag, props) {
  const el = document.createElement(tag);
  applyProps(el, props);
  appendChildren(el, Array.prototype.slice.call(arguments, 2));
  return el;
}
function s(tag, props) {
  const el = document.createElementNS(SVG_NS, tag);
  applyProps(el, props);
  appendChildren(el, Array.prototype.slice.call(arguments, 2));
  return el;
}
function applyProps(el, props) {
  if (!props) return;
  for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.setAttribute('class', v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value' && 'value' in el) el.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') { if (v) el.setAttribute(k, ''); }
    else el.setAttribute(k, v === true ? '' : String(v));
  }
}
function appendChildren(el, kids) {
  for (const c of kids) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) appendChildren(el, c);
    else el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

const ICONS = {

};
function icon(name, size) {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', size || 18);
  svg.setAttribute('height', size || 18);

/* ---------- 格式化 ---------- */
const MINUS = '−';
function num(v, minDp, maxDp) {
  return v.toLocaleString('en-US', { minimumFractionDigits: minDp, maximumFractionDigits: maxDp == null ? minDp : maxDp });
}
function fmtQty(v) {
  if (v == null || !isFinite(v)) return '—';
  return num(v, 0, 8);
}

function fmtPrice(v, cur) {
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v);
  let str;
  if (a >= 1000) str = num(v, 0, 2);
  else if (a >= 1) str = num(v, 2, 4);
  else if (a === 0) str = '0';
  else str = num(Number(v.toPrecision(4)), 0, 10);
  return str;
}
function fmtMoney(v, cur) {
  if (v == null || !isFinite(v)) return '—';
  return cur === 'TWD' ? 'NT$ ' + num(v, 0) : '$' + num(v, 2);
}
function fmtSigned(v, cur) {
  if (v == null || !isFinite(v)) return '—';
  const r = cur === 'TWD' ? Math.round(v) : Math.round(v * 100) / 100;
  if (r === 0) return fmtMoney(0, cur);
  return (r > 0 ? '+' : MINUS) + fmtMoney(Math.abs(r), cur);
}
function fmtPct(v, signed) {
  if (v == null || !isFinite(v)) return '—';
  const r = Math.round(v * 10000) / 100;
  if (!signed) return num(Math.abs(r), 2) + '%';
  if (r === 0) return '0.00%';
  return (r > 0 ? '+' : MINUS) + num(Math.abs(r), 2) + '%';
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmtDT(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtDate(ts, utc) {
  const d = new Date(utc ? ts + MKT_OFFSET : ts);
  return utc
    ? d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate())
    : d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function toLocalInput(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtTime(ts) {
  const d = new Date(ts);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}
function signClass(v) { return v > 0 ? 'gain' : v < 0 ? 'loss' : ''; }
function arrow(v) { return v > 0 ? '▲ ' : v < 0 ? '▼ ' : ''; }

/* ---------- 刻度 ---------- */
function niceNum(range, round) {
  const exp = Math.floor(Math.log10(range));
  const f = range / Math.pow(10, exp);
  let nf;
  if (round) nf = f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10;
  else nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
  return nf * Math.pow(10, exp);
}
function niceTicks(min, max, count) {
  if (!(max > min)) { const pad = Math.abs(max) * 0.05 || 1; min -= pad; max += pad; }
  const range = niceNum(max - min, false);
  const step = niceNum(range / (count - 1), true);
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 0.5; v += step) ticks.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return { ticks, min: lo, max: hi, step };
}
function compact(v, cur) {
  const a = Math.abs(v);
  if (a >= 1e8 && cur === 'TWD') return num(v / 1e8, 0, 2) + '億';
  if (a >= 1e4 && cur === 'TWD') return num(v / 1e4, 0, 1) + '萬';
  if (a >= 1e6) return num(v / 1e6, 0, 2) + 'M';
  if (a >= 1e3) return num(v, 0, 0);
  return num(v, 0, a < 10 ? 2 : 1);
}
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function csvCell(v) {
  let t = v == null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; // 防止試算表公式注入
  if (/[",\n\r]/.test(t)) t = '"' + t.replace(/"/g, '""') + '"';
  return t;
}

/* ------------------------------------------------------------------
 * 帳本清單（多帳本切換）：只存名稱與 id，不含任何交易資料，
 * 每個帳本實際的加密資料仍各自獨立存在 Vault 裡（見 vault.js）。
 * ------------------------------------------------------------------ */
const Profiles = (function () {
  const K = 'usstockledger.profiles.v1';
  function raw() {
    try {
      const j = JSON.parse(window.localStorage.getItem(K));
      if (j && Array.isArray(j.list) && j.list.length) return j;
    } catch (e) { /* ignore */ }
    return null;
  }
  function save(o) { try { window.localStorage.setItem(K, JSON.stringify(o)); } catch (e) { /* ignore */ } }
  /** 第一次使用（或舊版沒有帳本清單）時，自動補上一個對應舊資料位置的預設帳本 */
  function ensure() {
    let o = raw();
    if (!o) { o = { list: [{ id: 'default', name: '主帳本', createdAt: Date.now() }], current: 'default' }; save(o); }
    if (!o.list.some((p) => p.id === o.current)) o.current = o.list[0].id;
    return o;
  }
  function list() { return ensure().list; }
  function current() { return ensure().current; }
  function setCurrent(id) { const o = ensure(); if (o.list.some((p) => p.id === id)) { o.current = id; save(o); } }
  function add(name) {
    const o = ensure();
    const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    o.list.push({ id, name: name.slice(0, 30), createdAt: Date.now() });
    save(o);
    return id;
  }
  function rename(id, name) {
    const o = ensure();
    const p = o.list.filter((x) => x.id === id)[0];
    if (p) { p.name = name.slice(0, 30); save(o); }
  }
  /** 從清單移除（不含 Vault 資料本身，呼叫端要另外 Vault.reset(id)）；至少留一個帳本 */
  function remove(id) {
    const o = ensure();
    if (o.list.length <= 1) return false;
    o.list = o.list.filter((x) => x.id !== id);
    if (o.current === id) o.current = o.list[0].id;
    save(o);
    return true;
  }
  return { list, current, setCurrent, add, rename, remove };
})();

/* ===== engine.js ===== */
/* ------------------------------------------------------------------
 * Engine：交易流水 → 持股 / 成本 / 損益（純函式，無 DOM、無網路）
 * 金額一律為美元；數量一律為「股」。
 * 交易類型：
 *   buy   買入：qty 股 × price，fee 手續費
 *   sell  賣出：qty 股 × price，fee 手續費，tax 其他費用（SEC／TAF 等）
 *   div   現金股利：qty = 參與配息股數，price = 每股配息，fee = 預扣稅等扣款
 *   sdiv  股票股利（配股）：qty = 配發股數，fee = 扣款；總成本不變
 *   split 分割／合併：qty = 換股比例（新股數 ÷ 舊股數），price = 每股（舊股）退還現金
 * ------------------------------------------------------------------ */
const Engine = (function () {
  const EPS = 1e-9;
  // 同一時間：公司行動（分割、配股）先套用，再處理買入、配息，最後才是賣出；最後以 id 穩定排序
  const TYPE_ORDER = { split: 0, sdiv: 1, buy: 2, div: 3, sell: 4 };
  const TYPES = ['buy', 'sell', 'div', 'sdiv', 'split'];

  function sortTx(txs) {
    return txs.slice().sort((a, b) => {
      if (a.ts !== b.ts) return a.ts - b.ts;
      const ta = TYPE_ORDER[a.type] == null ? 9 : TYPE_ORDER[a.type];
      const tb = TYPE_ORDER[b.type] == null ? 9 : TYPE_ORDER[b.type];
      if (ta !== tb) return ta - tb;
      return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
    });
  }

  /** 只有買賣才是「市場成交價」；股利、分割的 price 欄位意義不同 */
  function isTrade(t) { return t.type === 'buy' || t.type === 'sell'; }

  function newPos(asset) {
    return {
      asset, qty: 0, cost: 0, lots: [],
      realized: 0, boughtQty: 0, boughtCost: 0, soldQty: 0, soldProceeds: 0,
      fees: 0, taxes: 0, dividends: 0, returned: 0,
      firstTs: null, lastPrice: null,
    };
  }

  /** 股數改變但總成本不變（配股、分割）：FIFO 各批依比例放大股數、攤低單價 */
  function scaleLots(p, factor) {
    if (!(factor > 0)) return;
    p.lots.forEach((l) => { l.qty *= factor; l.unit /= factor; });
  }

  /**
   * 依序重播交易。
   * opts.method: 'avg'（加權平均）| 'fifo'
   * opts.upTo:   只計算到此時間戳（含）
   */
  function replay(txs, opts) {
    opts = opts || {};
    const method = opts.method === 'fifo' ? 'fifo' : 'avg';
    const upTo = opts.upTo == null ? Infinity : opts.upTo;
    const positions = {};
    const events = {};
    const issues = [];

    for (const tx of sortTx(txs)) {
      if (tx.ts > upTo) break;
      const fee = tx.fee || 0;
      const tax = tx.tax || 0;
      const p = positions[tx.asset] || (positions[tx.asset] = newPos(tx.asset));

      if (tx.type === 'buy') {
        if (p.firstTs == null) p.firstTs = tx.ts;
        p.lastPrice = tx.price;
        const total = tx.qty * tx.price + fee;
        p.fees += fee;
        p.qty += tx.qty;
        p.cost += total;
        p.boughtQty += tx.qty;
        p.boughtCost += total;
        if (method === 'fifo') p.lots.push({ qty: tx.qty, unit: total / tx.qty });
        events[tx.id] = { type: 'buy', total };
      } else if (tx.type === 'sell') {
        p.lastPrice = tx.price;
        p.fees += fee;
        p.taxes += tax;
        let q = tx.qty;
        if (q > p.qty + EPS * Math.max(1, p.qty)) {
          issues.push({ id: tx.id, kind: 'oversell', asset: tx.asset, short: q - p.qty });
          q = Math.max(p.qty, 0);
        }
        let costOut = 0;
        if (q > 0) {
          if (method === 'avg') {
            costOut = p.qty > 0 ? p.cost * (q / p.qty) : 0;
          } else {
            let need = q;
            while (need > EPS && p.lots.length) {
              const lot = p.lots[0];
              const take = Math.min(lot.qty, need);
              costOut += take * lot.unit;
              lot.qty -= take;
              need -= take;
              if (lot.qty <= EPS) p.lots.shift();
            }
          }
        }
        const proceeds = q * tx.price - fee - tax;
        const pnl = proceeds - costOut;
        p.qty -= q;
        p.cost -= costOut;
        p.realized += pnl;
        p.soldQty += q;
        p.soldProceeds += proceeds;
        events[tx.id] = { type: 'sell', proceeds, costOut, pnl, qty: q };
      } else if (tx.type === 'div') {
        const cash = tx.qty * tx.price - fee;
        p.realized += cash;
        p.dividends += cash;
        events[tx.id] = { type: 'div', cash, pnl: cash };
      } else if (tx.type === 'sdiv') {
        if (p.qty <= EPS) issues.push({ id: tx.id, kind: 'nopos', asset: tx.asset });
        const before = p.qty;
        p.qty += tx.qty;
        if (method === 'fifo') {
          if (before > EPS) scaleLots(p, p.qty / before);
          else p.lots.push({ qty: tx.qty, unit: 0 });
        }
        if (fee) { p.realized -= fee; p.dividends -= fee; }
        events[tx.id] = { type: 'sdiv', qty: tx.qty, pnl: fee ? -fee : 0 };
      } else if (tx.type === 'split') {
        const ratio = tx.qty;
        const before = p.qty;
        if (before <= EPS) {
          issues.push({ id: tx.id, kind: 'nopos', asset: tx.asset });
          events[tx.id] = { type: 'split', before: 0, after: 0, cash: 0, pnl: 0 };
        } else {
          let after = before * ratio;
          // 反向分割／合併：不足一股的零股以現金發還，這裡直接捨去（金額很小，可另用「退還現金」補記）
          if (Math.abs(before - Math.round(before)) < EPS) after = Math.floor(after + 1e-6);
          const cash = Math.max(0, before * (tx.price || 0) - fee);
          const costBefore = p.cost;
          p.qty = after;
          if (method === 'fifo') scaleLots(p, after / before);
          // 退還的現金視為「拿回本金」：先沖減成本，超過成本的部分才算已實現獲利
          let gain = 0;
          if (cash > 0) {
            const back = Math.min(cash, costBefore);
            gain = cash - back;
            p.cost -= back;
            if (method === 'fifo' && costBefore > 0) {
              const k = p.cost / costBefore;
              p.lots.forEach((l) => { l.unit *= k; });
            }
            p.returned += cash;
            p.realized += gain;
          }
          events[tx.id] = { type: 'split', before, after, cash, pnl: gain };
        }
      }

      if (p.qty < 1e-9) { p.qty = 0; p.cost = 0; p.lots = []; }
    }

    for (const a in positions) {
      const p = positions[a];
      p.avgCost = p.qty > 0 ? p.cost / p.qty : 0;
    }
    return { positions, events, issues };
  }

  /**
   * 以價格表估值。priceOf(asset) → { price, pct, src, date } | null
   * 無報價的持股 value = null，不計入市值，但會回報在 missing。
   */
  function summarize(result, priceOf) {
    const rows = [];
    const missing = [];
    let value = 0, cost = 0, dayChange = 0, realized = 0, bought = 0, fees = 0, taxes = 0, dividends = 0;
    for (const a in result.positions) {
      const p = result.positions[a];
      realized += p.realized;
      bought += p.boughtCost;
      fees += p.fees;
      taxes += p.taxes;
      dividends += p.dividends;
      if (p.qty <= 0) continue;
      const q = priceOf(a);
      const row = {
        asset: a, qty: p.qty, cost: p.cost, avgCost: p.avgCost, realized: p.realized,
        bought: p.boughtCost, sold: p.soldProceeds + p.returned, dividends: p.dividends,
        price: q ? q.price : null, pct: q && q.pct != null ? q.pct : null, src: q ? q.src : null, date: q ? q.date : null,
        value: null, unrealized: null, unrealizedPct: null,
      };
      if (q) {
        row.value = p.qty * q.price;
        row.unrealized = row.value - p.cost;
        row.unrealizedPct = p.cost > 0 ? row.unrealized / p.cost : null;
        value += row.value;
        cost += p.cost;

/* ===== synccore.js ===== */
/* ------------------------------------------------------------------
 * SyncCore：雲端同步的純函式（無網路、無 DOM，可在 node 單元測試）
 *  - 每筆交易帶 u（最後修改時間），刪除留下墓碑 deleted[id]，手動價格帶 at
 *  - merge：兩邊各自改動後合併，以「最後修改者勝」處理同一筆的衝突
 * ------------------------------------------------------------------ */
const SyncCore = (function () {
  const TX_KEYS = ['ts', 'type', 'asset', 'qty', 'price', 'fee', 'tax', 'fx', 'note'];

  function sameTx(a, b) {
    return TX_KEYS.every((k) => (a[k] == null ? null : a[k]) === (b[k] == null ? null : b[k]));
  }
  function cleanTx(t) {
    return { id: t.id, ts: t.ts, type: t.type, asset: t.asset, qty: t.qty, price: t.price, fee: t.fee || 0, tax: t.tax || 0, fx: t.fx == null ? null : t.fx, note: t.note || '', u: t.u > 0 ? +t.u : 0 };
  }

  /** 代號 → 數值 的小表格（手動價格、目標價共用這個形狀）：{ASSET: {p, at}} */
  function mapOf(vals, ats) {
    const out = {};
    const assets = {};
    Object.keys(vals || {}).forEach((a) => { assets[a] = 1; });
    Object.keys(ats || {}).forEach((a) => { assets[a] = 1; });
    Object.keys(assets).sort().forEach((a) => {
      out[a] = { p: vals && vals[a] > 0 ? +vals[a] : null, at: (ats && +ats[a]) || 0 };
    });
    return out;
  }
  function mergeMap(a, b) {
    const out = {};
    const assets = {};
    Object.keys(a || {}).forEach((k) => { assets[k] = 1; });
    Object.keys(b || {}).forEach((k) => { assets[k] = 1; });
    Object.keys(assets).sort().forEach((k) => {
      const win = pickNewer(a && a[k], b && b[k], 'at');
      out[k] = { p: win.p > 0 ? +win.p : null, at: win.at || 0 };
    });
    return out;
  }
  function applyMap(map) {
    const vals = {}, ats = {};
    Object.keys(map).forEach((k) => {
      if (map[k].p > 0) vals[k] = map[k].p;
      if (map[k].at) ats[k] = map[k].at;
    });
    return { vals, ats };
  }

  /** 本機資料 → 要同步的內容（只含交易、刪除墓碑、手動價格、目標價；不含設定與 Token） */
  function payloadOf(d) {

    const deleted = {};
    Object.keys(d.deleted || {}).sort().forEach((id) => { deleted[id] = +d.deleted[id]; });
    const mp = mapOf(d.manualPrices, d.mpAt);
    const tp = mapOf(d.targets, d.targetAt);

  }

  function canon(p) { return JSON.stringify(p); }

  function pickNewer(a, b, key) {
    if (!a) return b;
    if (!b) return a;
    if ((b[key] || 0) > (a[key] || 0)) return b;
    if ((b[key] || 0) < (a[key] || 0)) return a;
    // 時間相同：用內容決定，確保兩台裝置合併結果一致
    return JSON.stringify(b) > JSON.stringify(a) ? b : a;
  }

  function merge(a, b) {
    const deleted = {};
    [a.deleted, b.deleted].forEach((m) => Object.keys(m || {}).forEach((id) => { deleted[id] = Math.max(deleted[id] || 0, +m[id] || 0); }));
    const byId = {};
    [a.txs, b.txs].forEach((list) => (list || []).forEach((t) => { byId[t.id] = pickNewer(byId[t.id], t, 'u'); }));
    const txs = [];
    Object.keys(byId).forEach((id) => {
      const t = byId[id];
      if (deleted[id] != null) {
        if (deleted[id] >= (t.u || 0)) return;   // 刪除比最後修改新（或一樣新）→ 維持刪除
        delete deleted[id];                       // 刪除之後又被修改 → 復活
      }
      txs.push(cleanTx(t));
    });
    txs.sort((x, y) => (x.id < y.id ? -1 : x.id > y.id ? 1 : 0));
    const mp = mergeMap(a.mp, b.mp);
    const tp = mergeMap(a.tp, b.tp);
    const dl = {};
    Object.keys(deleted).sort().forEach((id) => { dl[id] = deleted[id]; });
    return { v: 1, txs, deleted: dl, mp, tp };
  }

  /** 把合併結果寫回本機資料物件（就地修改；設定與 sync 設定不動） */
  function applyTo(d, p) {
    d.txs = p.txs.map((t) => Object.assign({}, t));
    d.deleted = Object.assign({}, p.deleted);
    const mp = applyMap(p.mp);

    const tp = applyMap(p.tp || {});

  function stamp(oldTxs, newTxs, oldDeleted, now) {

    const deleted = Object.assign({}, oldDeleted || {});
    const seen = {};
    const txs = newTxs.map((t) => {
      seen[t.id] = 1;
      const o = oldById[t.id];
      if (o && sameTx(o, t)) return Object.assign({}, t, { u: o.u || 0 });
      const u = Math.max(now, (deleted[t.id] || 0) + 1);
      delete deleted[t.id];
      return Object.assign({}, t, { u });
    });
    Object.keys(oldById).forEach((id) => { if (!seen[id]) deleted[id] = Math.max(now, (oldById[id].u || 0) + 1); });
    return { txs, deleted };
  }

  /** 手動價格變動時蓋時間 */
  function stampMp(oldMp, oldAt, newMp, now) {
    const at = Object.assign({}, oldAt || {});
    const keys = {};
    Object.keys(oldMp || {}).forEach((k) => { keys[k] = 1; });
    Object.keys(newMp || {}).forEach((k) => { keys[k] = 1; });
    Object.keys(keys).forEach((k) => {
      const a = oldMp && oldMp[k] > 0 ? +oldMp[k] : null, b = newMp && newMp[k] > 0 ? +newMp[k] : null;
      if (a !== b) at[k] = Math.max(now, (at[k] || 0) + 1);
    });
    return at;
  }

  return { payloadOf, canon, merge, applyTo, stamp, stampMp, sameTx };
})();

/* ===== vault.js ===== */
/* ------------------------------------------------------------------
 * Vault：以 4 位數密碼（PBKDF2 → AES-GCM）加密後存進瀏覽器 localStorage。
 * 資料只存在這台裝置的瀏覽器裡，不會上傳到 GitHub 或任何伺服器。
 * ------------------------------------------------------------------ */

  // 其他帳本用各自的 id 加上後綴，彼此完全獨立的 localStorage 空間。
  function keyData(id) { return id === 'default' ? 'usstockledger.vault.v1' : 'usstockledger.vault.' + id + '.v1'; }

  /** 解密備份檔（需輸入建立該備份時的密碼），回傳資料物件 */

/* ===== usrules.js ===== */
/* ------------------------------------------------------------------
 * UsRules：美股（複委託）交易成本規則（純函式，金額為美元）
 *   手續費 = 成交金額 × 費率，四捨五入到分；未達最低手續費以最低計
 *   賣出其他費用（SEC fee、TAF 等交易所費）= 成交金額 × 費率，四捨五入到分
 * ------------------------------------------------------------------ */
const UsRules = (function () {
  function r2(v) { return Math.round(v * 100 + 1e-9) / 100; }
  /** cfg: { rate (0–1), minFee } */
  function fee(amount, cfg) {
    if (!(amount > 0)) return 0;
    cfg = cfg || {};
    return Math.max(cfg.minFee > 0 ? cfg.minFee : 0, r2(amount * (cfg.rate > 0 ? cfg.rate : 0)));
  }
  function sellFee(amount, cfg) {
    if (!(amount > 0)) return 0;
    return r2(amount * (cfg && cfg.sellRate > 0 ? cfg.sellRate : 0));
  }
  return { r2, fee, sellFee };
})();
if (typeof module !== 'undefined' && module.exports) module.exports.UsRules = UsRules;

/* ===== market.js ===== */
/* ------------------------------------------------------------------
 * Market：美股行情與美元匯率（FinMind 公開資料 API）
 *   - 報價：每日收盤價（盤中為最近一個交易日的收盤；不是即時成交價）
 *   - 歷史：日收盤價（未還原權息，搭配帳本裡的分割紀錄即可正確估值）
 *   - 匯率：臺灣銀行美元即期匯率（買入與賣出的中間價），用來換算台幣
 * ------------------------------------------------------------------ */
const MKT_OFFSET = -5 * 3600000; // 美東標準時間（UTC−5）；只用來切「交易日」，夏令時間差一小時不影響
const DAY = 86400000;
/** 美東日期的 00:00（毫秒時間戳） */
function mktDayStart(ts) { return Math.floor((ts + MKT_OFFSET) / DAY) * DAY - MKT_OFFSET; }
/** 時間戳 → 美東日期字串 YYYY-MM-DD */
function mktDateStr(ts) {
  const d = new Date(ts + MKT_OFFSET);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}
/** YYYY-MM-DD（美東日期）→ 當天 00:00 的時間戳 */
function mktDateTs(str) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(str || '');
  return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) - MKT_OFFSET : null;
}
/** 台灣時間的星期（0=日） */
function mktWeekday(ts) { return new Date(ts + MKT_OFFSET).getUTCDay(); }
/** 是否在台股交易時段附近（週一至五 08:55–14:35，台灣時間；不含國定假日判斷） */
function mktOpen(ts) {
  const wd = mktWeekday(ts);
  if (wd === 0 || wd === 6) return false;
  const min = Math.floor(((ts + MKT_OFFSET) % DAY) / 60000);
  return min >= 505 && min <= 970; // 涵蓋夏令與冬令的 09:30–16:00（美東）
}

const Market = (function () {
  const FM = 'https://api.finmindtrade.com/api/v4/data';
  const INFO_KEY = 'usstockledger.info.v1';
  let token = '';

  function setToken(t) { token = (t || '').trim(); }

  async function fetchWithTimeout(url, ms) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms || 12000);
    try { return await fetch(url, { signal: ctl.signal, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' }); }
    finally { clearTimeout(timer); }
  }

  async function fm(params, ms) {
    const p = Object.assign({}, params);
    if (token) p.token = token;
    const res = await fetchWithTimeout(FM + '?' + new URLSearchParams(p).toString(), ms);
    let j = null;
    try { j = await res.json(); } catch (e) { /* ignore */ }
    const st = j && j.status != null ? j.status : res.status;
    if (!res.ok || st !== 200) {
      const e = new Error((j && j.msg) || ('HTTP ' + res.status));
      e.status = st === 200 ? res.status : st;
      e.src = 'FinMind';
      throw e;
    }
    return Array.isArray(j.data) ? j.data : [];
  }

  /** 同時最多 n 個請求 */
  async function pool(items, n, fn) {
    const out = [];
    let i = 0;
    async function worker() { while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); } }
    await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
    return out;
  }

  /** FinMind 美股欄位是大寫開頭（Close），保留小寫相容 */
  function closeOf(r) { const c = r.Close != null ? +r.Close : +r.close; return c > 0 ? c : 0; }

  /**
   * 取得多檔股票的最新收盤價與漲跌幅（相對前一交易日）。
   * 回傳 { prices: {code: {price, pct, date}}, unknown: [...], limited: bool }
   */
  async function fetchQuotes(codes) {
    const prices = {};
    const unknown = [];
    let limited = false, netErr = null;
    const start = mktDateStr(Date.now() - 20 * DAY);
    await pool(codes, 4, async (c) => {
      if (limited) return;
      try {
        const rows = (await fm({ dataset: 'USStockPrice', data_id: c, start_date: start })).filter((r) => closeOf(r) > 0);
        if (rows.length) {
          const last = rows[rows.length - 1], prev = rows[rows.length - 2];
          prices[c] = { price: closeOf(last), pct: prev ? (closeOf(last) / closeOf(prev) - 1) * 100 : null, date: last.date, src: 'FinMind' };
        } else unknown.push(c);
      } catch (e) {
        if (e.status === 402 || e.status === 429) limited = true;
        else netErr = e;
      }
    });
    if (!Object.keys(prices).length && codes.length && (netErr || limited)) {
      const e = netErr || new Error('RATE');
      if (limited) e.status = 402;
      throw e;
    }
    const missing = codes.filter((c) => !prices[c] && unknown.indexOf(c) < 0);
    return { prices, unknown, missing, limited };
  }

  /** 日收盤（美東日期）。回傳 [{day, close}]，day 為美東當日 00:00 的時間戳，升冪 */
  async function fetchDailyCloses(code, startTs) {
    const rows = await fm({ dataset: 'USStockPrice', data_id: code, start_date: mktDateStr(startTs) }, 20000);
    return rows.map((r) => ({ day: mktDateTs(r.date), close: closeOf(r) })).filter((r) => r.close > 0)
      .filter((r) => r.day != null).sort((a, b) => a.day - b.day);
  }

  /**
   * 除權息與分割事件：FinMind 沒有美股的股利／分割資料，所以美股版不提供「可能漏記」提示。
   */
  async function fetchCorpActions() { return []; }

  /**
   * 美元兌台幣日匯率（臺灣銀行牌告，取即期買入與賣出的中間價）。
   * 回傳 [{day, date, rate}]，day 為台灣當日 00:00 的時間戳，升冪
   */
  async function fetchFx(startTs) {
    const d = new Date(startTs + 8 * 3600000);
    const start = d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
    const rows = await fm({ dataset: 'TaiwanExchangeRate', data_id: 'USD', start_date: start }, 20000);
    const out = [];
    rows.forEach((r) => {
      const b = +r.spot_buy, s2 = +r.spot_sell, cb = +r.cash_buy, cs = +r.cash_sell;
      let rate = b > 0 && s2 > 0 ? (b + s2) / 2 : (cb > 0 && cs > 0 ? (cb + cs) / 2 : (s2 > 0 ? s2 : b > 0 ? b : 0));
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(r.date || '');
      if (!(rate > 0) || !m) return;
      rate = Math.round(rate * 10000) / 10000;
      out.push({ day: Date.UTC(+m[1], +m[2] - 1, +m[3]) - 8 * 3600000, date: m[0], rate });
    });
    return out.sort((a, b) => a.day - b.day);
  }

  /** 股票代號 → 名稱／市場別。整份清單快取 7 天（公開資料，不含個人資訊） */
  function cachedInfo() {
    try { const j = JSON.parse(localStorage.getItem(INFO_KEY)); if (j && j.map && j.ts) return j; } catch (e) { /* ignore */ }
    return null;
  }
  async function fetchInfo(force) {
    const c = cachedInfo();
    if (c && !force && Date.now() - c.ts < 7 * DAY) return c.map;
    const rows = await fm({ dataset: 'USStockInfo' }, 30000);
    const map = {};
    rows.forEach((r) => {
      const id = String(r.stock_id || '').toUpperCase();
      if (!id || map[id]) return;
      map[id] = [String(r.stock_name || '').slice(0, 60)];
    });
    try { localStorage.setItem(INFO_KEY, JSON.stringify({ ts: Date.now(), map })); } catch (e) { /* ignore */ }
    return map;
  }

  return { setToken, fetchQuotes, fetchDailyCloses, fetchCorpActions, fetchFx, fetchInfo, cachedInfo };
})();

/* ===== charts.js ===== */
/* ------------------------------------------------------------------
 * Charts：純 SVG，無外部套件。含 hover / 鍵盤瀏覽的提示框。
 * ------------------------------------------------------------------ */
const Tip = (function () {
  let el = null;
  function ensure() {
    if (!el) { el = h('div', { class: 'tip', role: 'tooltip' }); el.hidden = true; document.body.appendChild(el); }
    return el;
  }
  function show(cx, cy, nodes) {
    const t = clear(ensure());
    nodes.forEach((n) => t.appendChild(n));
    t.hidden = false;
    const w = t.offsetWidth, hh = t.offsetHeight;
    let x = cx + 14, y = cy - hh - 12;
    if (x + w > window.innerWidth - 8) x = cx - w - 14;
    if (x < 8) x = 8;
    if (y < 8) y = cy + 18;
    t.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
  }
  function hide() { if (el) el.hidden = true; }
  return { show, hide };
})();

function tipRow(keyColor, label, value, strong) {
  return h('div', { class: 'tip-row' },
    keyColor ? h('span', { class: 'tip-key', style: { background: keyColor } }) : h('span', { class: 'tip-key none' }),
    h('span', { class: 'tip-label' }, label),
    h('span', { class: 'tip-val' + (strong ? ' strong' : '') }, value));
}

/* ================= 淨值曲線 ================= */
function lineChart(container, pts, o) {
  clear(container);
  const cur = o.cur;
  const compact_ = !!o.compact;                 // 小圖：各股曲線用
  const col = o.color || 'var(--c1)';           // 市值線顏色（各股沿用配置圖的顏色）
  const nameTag = o.name ? o.name + '：' : '';
  const W = Math.max(container.clientWidth || 640, 240), H = compact_ ? 200 : 280;
  const m = compact_ ? { t: 14, r: 14, b: 26, l: cur === 'TWD' ? 56 : 50 } : { t: 16, r: 20, b: 30, l: cur === 'TWD' ? 60 : 56 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = pts.length;
  const x0 = pts[0].ts, x1 = pts[n - 1].ts;

  let lo = Infinity, hi = -Infinity;
  for (const p of pts) { lo = Math.min(lo, p.value, p.cost); hi = Math.max(hi, p.value, p.cost); }
  const pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.05 || 1;
  lo = lo >= 0 ? Math.max(0, lo - pad) : lo - pad;
  hi = hi + pad;
  const nt = niceTicks(lo, hi, compact_ ? 4 : 5);

  const X = (ts) => m.l + (x1 === x0 ? iw / 2 : ((ts - x0) / (x1 - x0)) * iw);
  const Y = (v) => m.t + ih - ((v - nt.min) / (nt.max - nt.min)) * ih;

  const svg = s('svg', {
    class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img', tabindex: 0,
    'aria-label': nameTag + '資產淨值曲線：' + fmtDate(x0, true) + ' 至今，市值由 ' + fmtMoney(pts[0].value, cur) + ' 變為 ' +
      fmtMoney(pts[n - 1].value, cur) + '。可用左右方向鍵逐日瀏覽。',
  });

  // 格線與 Y 軸刻度
  nt.ticks.forEach((v, i) => {
    const y = Y(v);
    svg.appendChild(s('line', { class: i === 0 ? 'axis' : 'grid', x1: m.l, x2: W - m.r, y1: y, y2: y }));
    svg.appendChild(s('text', { class: 'tick', x: m.l - 8, y: y + 4, 'text-anchor': 'end' }, compact(v, cur)));
  });

  // X 軸刻度
  const long = x1 - x0 > 400 * 86400000;
  const seen = {};
  const nx = Math.min(compact_ ? 3 : 5, n);
  for (let i = 0; i < nx; i++) {
    const idx = nx === 1 ? 0 : Math.round((i * (n - 1)) / (nx - 1));
    const d = fmtDate(pts[idx].ts, true);
    const label = long ? d.slice(0, 7) : d.slice(5);
    if (seen[label]) continue;
    seen[label] = 1;
    const anchor = i === 0 ? 'start' : i === nx - 1 ? 'end' : 'middle';
    svg.appendChild(s('text', { class: 'tick', x: X(pts[idx].ts), y: H - 8, 'text-anchor': anchor }, label));
  }

  // 折線：成本（背景）→ 市值（重點）
  const path = (key) => pts.map((p, i) => (i ? 'L' : 'M') + X(p.ts).toFixed(1) + ' ' + Y(p[key]).toFixed(1)).join('');
  svg.appendChild(s('path', { class: 'line', d: path('cost'), style: { stroke: 'var(--ink-3)' } }));
  svg.appendChild(s('path', { class: 'line', d: path('value'), style: { stroke: col } }));

  // 終點標記與數值
  const last = pts[n - 1];
  svg.appendChild(s('circle', { class: 'dot', cx: X(last.ts), cy: Y(last.value), r: 4, style: { fill: col } }));
  svg.appendChild(s('text', { class: 'endlabel', x: X(last.ts), y: Y(last.value) - 10, 'text-anchor': 'end' }, fmtMoney(last.value, cur)));

  // hover 層
  const cross = s('line', { class: 'cross', y1: m.t, y2: m.t + ih, x1: 0, x2: 0, visibility: 'hidden' });
  const hv = s('circle', { class: 'dot', r: 4, visibility: 'hidden', style: { fill: col } });
  const hc = s('circle', { class: 'dot', r: 4, visibility: 'hidden', style: { fill: 'var(--ink-3)' } });
  svg.appendChild(cross); svg.appendChild(hc); svg.appendChild(hv);
  const overlay = s('rect', { class: 'overlay', x: m.l, y: m.t, width: iw, height: ih });
  svg.appendChild(overlay);

  let cur_i = n - 1;
  function showAt(i, fromKeyboard) {
    cur_i = i;
    const p = pts[i];
    const px = X(p.ts);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    hv.setAttribute('cx', px); hv.setAttribute('cy', Y(p.value)); hv.setAttribute('visibility', 'visible');
    hc.setAttribute('cx', px); hc.setAttribute('cy', Y(p.cost)); hc.setAttribute('visibility', 'visible');
    const r = svg.getBoundingClientRect();
    const cx = r.left + (px / W) * r.width, cy = r.top + (Y(p.value) / H) * r.height;
    const pnl = p.value - p.cost;
    const isNow = i === n - 1;
    Tip.show(cx, cy, [
      h('div', { class: 'tip-head' }, (o.name ? o.name + '　' : '') + (isNow ? '現在　' + fmtDT(p.ts) : fmtDate(p.ts, true) + '（收盤）')),
      tipRow(col, '市值', fmtMoney(p.value, cur), true),
      tipRow('var(--ink-3)', '持股成本', fmtMoney(p.cost, cur), true),
      tipRow(null, '未實現損益', fmtSigned(pnl, cur) + (p.cost > 0 ? '（' + fmtPct(pnl / p.cost, true) + '）' : ''), false),
    ]);
    if (fromKeyboard) svg.setAttribute('data-idx', i);
  }
  function hideAll() {
    cross.setAttribute('visibility', 'hidden'); hv.setAttribute('visibility', 'hidden'); hc.setAttribute('visibility', 'hidden');
    Tip.hide();
  }
  function nearest(clientX) {
    const r = svg.getBoundingClientRect();
    const px = ((clientX - r.left) / r.width) * W;
    const ts = x0 + ((px - m.l) / iw) * (x1 - x0);
    let a = 0, b = n - 1;
    while (b - a > 1) { const mid = (a + b) >> 1; if (pts[mid].ts < ts) a = mid; else b = mid; }
    return Math.abs(pts[a].ts - ts) <= Math.abs(pts[b].ts - ts) ? a : b;
  }
  overlay.addEventListener('pointermove', (e) => showAt(nearest(e.clientX)));
  overlay.addEventListener('pointerdown', (e) => showAt(nearest(e.clientX)));
  overlay.addEventListener('pointerleave', hideAll);
  overlay.addEventListener('pointercancel', hideAll);
  svg.addEventListener('focus', () => showAt(cur_i, true));
  svg.addEventListener('blur', hideAll);
  svg.addEventListener('keydown', (e) => {
    let i = cur_i;
    if (e.key === 'ArrowLeft') i = Math.max(0, i - 1);
    else if (e.key === 'ArrowRight') i = Math.min(n - 1, i + 1);
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = n - 1;
    else return;
    e.preventDefault();
    showAt(i, true);
  });

  const legend = h('div', { class: 'legend' },
    h('span', { class: 'lg-item' }, h('span', { class: 'lg-line', style: { background: col } }), '市值'),
    h('span', { class: 'lg-item' }, h('span', { class: 'lg-line', style: { background: 'var(--ink-3)' } }), '持股成本'));
  if (!compact_) container.appendChild(legend);
  container.appendChild(svg);
}

/* ================= 各股報酬率變化（橫軸：持有第 N 天） ================= */
// 取第 day 天（±0.5 天內）最近的一個點；同一窗口有兩點時取較晚者（例如「現在」）
function retAt(pts, day) {
  let hit = null;
  for (const p of pts) if (p.d >= day - 0.5 && p.d < day + 0.5) hit = p;
  return hit;
}
function pctTick(v) { return fmtPct(v, true).replace(/\.00%$/, '%'); }
function returnChart(container, series, o) {
  clear(container);
  const W = Math.max(container.clientWidth || 640, 260), H = 300;
  const m = { t: 16, r: 22, b: 36, l: 58 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  let maxD = 0, lo = 0, hi = 0;
  series.forEach((se) => se.pts.forEach((p) => {
    maxD = Math.max(maxD, p.d);
    if (p.pct != null) { lo = Math.min(lo, p.pct); hi = Math.max(hi, p.pct); }
  }));
  if (maxD < 1) maxD = 1;
  const pad = (hi - lo) * 0.08 || 0.05;
  const nt = niceTicks(lo < 0 ? lo - pad : 0, hi + pad, 5);
  const X = (d) => m.l + (d / maxD) * iw;
  const Y = (v) => m.t + ih - ((v - nt.min) / (nt.max - nt.min)) * ih;
  const lastDay = Math.floor(maxD + 0.5);

  const desc = series.map((se) => {
    const last = se.pts[se.pts.length - 1];
    return se.asset + ' 目前 ' + fmtPct(last.pct, true);
  }).join('、');
  const svg = s('svg', {
    class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img', tabindex: 0,
    'aria-label': '各股報酬率變化（持有第 0 至第 ' + lastDay + ' 天）：' + desc + '。可用左右方向鍵逐日瀏覽。',
  });

  nt.ticks.forEach((v) => {
    const y = Y(v);
    svg.appendChild(s('line', { class: Math.abs(v) < 1e-9 ? 'axis' : 'grid', x1: m.l, x2: W - m.r, y1: y, y2: y }));
    svg.appendChild(s('text', { class: 'tick', x: m.l - 8, y: y + 4, 'text-anchor': 'end' }, pctTick(v)));
  });
  // X 軸刻度：整數天
  const xt = niceTicks(0, maxD, 6).ticks.filter((v) => v >= 0 && v <= maxD + 1e-9 && Math.abs(v - Math.round(v)) < 1e-9);
  xt.forEach((v, i) => {
    const anchor = v === 0 ? 'start' : (i === xt.length - 1 && X(v) > W - m.r - 16) ? 'end' : 'middle';
    svg.appendChild(s('text', { class: 'tick', x: X(v), y: H - 12, 'text-anchor': anchor }, '第 ' + Math.round(v) + ' 天'));
  });

  // 折線：null（已清倉）處斷開
  series.forEach((se) => {
    let d = '', pen = false;
    se.pts.forEach((p) => {
      if (p.pct == null) { pen = false; return; }
      d += (pen ? 'L' : 'M') + X(p.d).toFixed(1) + ' ' + Y(p.pct).toFixed(1);
      pen = true;
    });
    svg.appendChild(s('path', { class: 'line', d, style: { stroke: se.color } }));
    const last = se.pts[se.pts.length - 1];
    if (last.pct != null) svg.appendChild(s('circle', { class: 'dot', cx: X(last.d), cy: Y(last.pct), r: 4, style: { fill: se.color } }));
  });

  const cross = s('line', { class: 'cross', y1: m.t, y2: m.t + ih, x1: 0, x2: 0, visibility: 'hidden' });
  svg.appendChild(cross);
  const hdots = series.map((se) => {
    const c = s('circle', { class: 'dot', r: 4, visibility: 'hidden', style: { fill: se.color } });
    svg.appendChild(c);
    return c;
  });
  const overlay = s('rect', { class: 'overlay', x: m.l, y: m.t, width: iw, height: ih });
  svg.appendChild(overlay);

  let cur_i = lastDay;
  function showAt(day, fromKeyboard) {
    day = Math.max(0, Math.min(lastDay, day));
    cur_i = day;
    const px = X(Math.min(day, maxD));
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    const rows = [];
    series.forEach((se, i) => {
      const p = retAt(se.pts, day);
      if (p && p.pct != null) {
        hdots[i].setAttribute('cx', X(p.d)); hdots[i].setAttribute('cy', Y(p.pct)); hdots[i].setAttribute('visibility', 'visible');
        rows.push({ se, pct: p.pct, ts: p.ts });
      } else hdots[i].setAttribute('visibility', 'hidden');
    });
    rows.sort((a, b) => b.pct - a.pct);
    const r = svg.getBoundingClientRect();
    const cx = r.left + (px / W) * r.width;
    const cy = r.top + (rows.length ? Y(rows[0].pct) / H * r.height : m.t);
    Tip.show(cx, cy, [h('div', { class: 'tip-head' }, '持有第 ' + day + ' 天')].concat(
      rows.length ? rows.map((x) => tipRow(x.se.color, x.se.asset, fmtPct(x.pct, true), true)) : [tipRow(null, '這天沒有持股', '', false)]));
    if (fromKeyboard) svg.setAttribute('data-idx', day);
  }
  function hideAll() {
    cross.setAttribute('visibility', 'hidden');
    hdots.forEach((c) => c.setAttribute('visibility', 'hidden'));
    Tip.hide();
  }
  function dayOf(clientX) {
    const r = svg.getBoundingClientRect();
    const px = ((clientX - r.left) / r.width) * W;
    return Math.round(((px - m.l) / iw) * maxD);
  }
  overlay.addEventListener('pointermove', (e) => showAt(dayOf(e.clientX)));
  overlay.addEventListener('pointerdown', (e) => showAt(dayOf(e.clientX)));
  overlay.addEventListener('pointerleave', hideAll);
  overlay.addEventListener('pointercancel', hideAll);
  svg.addEventListener('focus', () => showAt(cur_i, true));
  svg.addEventListener('blur', hideAll);
  svg.addEventListener('keydown', (e) => {
    let d = cur_i;
    if (e.key === 'ArrowLeft') d = Math.max(0, d - 1);

    else if (e.key === 'Home') d = 0;
    else if (e.key === 'End') d = lastDay;

    e.preventDefault();
    showAt(d, true);
  });

  const legend = h('div', { class: 'legend wrap' }, series.map((se) => {
    const last = se.pts[se.pts.length - 1];
    return h('span', { class: 'lg-item' }, h('span', { class: 'lg-line', style: { background: se.color } }), se.asset,
      last.pct != null ? h('span', { class: 'num ' + signClass(last.pct) }, fmtPct(last.pct, true)) : null);

/* ================= 資產配置（單一橫向堆疊條） ================= */
function allocBar(container, rows, o) {
  clear(container);
  const cur = o.cur;
  const priced = rows.filter((r) => r.value > 0);
  const total = priced.reduce((a, r) => a + r.value, 0);
  if (!(total > 0)) { container.appendChild(h('p', { class: 'muted' }, '尚無可估值的持股。')); return; }

  const segs = [];
  const other = { asset: '其他', value: 0, names: [], color: 'var(--c-other)' };
  for (const r of priced) {
    const color = o.colorOf(r.asset);
    if (color && r.value / total >= 0.015) segs.push({ asset: r.asset, value: r.value, color });
    else { other.value += r.value; other.names.push(r.asset); }
  }
  if (other.value > 0) segs.push(other);

  const W = Math.max(container.clientWidth || 600, 240), H = 32, barY = 6, barH = 20;
  const clipId = 'allocClip' + Math.floor(Math.random() * 1e9);
  const svg = s('svg', { class: 'alloc', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'group', 'aria-label': '資產配置比例' });
  svg.appendChild(s('defs', null, s('clipPath', { id: clipId }, s('rect', { x: 0, y: barY, width: W, height: barH, rx: 4, ry: 4 }))));
  const g = s('g', { 'clip-path': 'url(#' + clipId + ')' });
  svg.appendChild(g);

  let x = 0;
  segs.forEach((sg, i) => {
    const w = (sg.value / total) * W;
    const gapL = i > 0 ? 1 : 0, gapR = i < segs.length - 1 ? 1 : 0;
    const seg = s('rect', { class: 'seg', x: x + gapL, y: barY, width: Math.max(w - gapL - gapR, 0.5), height: barH, style: { fill: sg.color } });
    g.appendChild(seg);
    const share = sg.value / total;
    const label = sg.asset + ' ' + fmtPct(share);
    const hit = s('rect', { class: 'hit', x, y: 0, width: Math.max(w, 1), height: H, tabindex: 0, role: 'img', 'aria-label': label + '，市值 ' + fmtMoney(sg.value, cur) });
    const show = (cx, cy) => {
      seg.classList.add('hot');
      const rowsEl = [
        h('div', { class: 'tip-head' }, sg.asset + (sg.names ? '（' + sg.names.join('、') + '）' : '')),
        tipRow(sg.color, '市值', fmtMoney(sg.value, cur), true),
        tipRow(null, '占比', fmtPct(share), false),
      ];
      Tip.show(cx, cy, rowsEl);
    };
    const hide = () => { seg.classList.remove('hot'); Tip.hide(); };
    hit.addEventListener('pointermove', (e) => show(e.clientX, e.clientY));
    hit.addEventListener('pointerdown', (e) => show(e.clientX, e.clientY));
    hit.addEventListener('pointerleave', hide);
    hit.addEventListener('focus', () => { const r = hit.getBoundingClientRect(); show(r.left + r.width / 2, r.top); });
    hit.addEventListener('blur', hide);
    svg.appendChild(hit);
    x += w;
  });

  const legend = h('div', { class: 'legend wrap' }, segs.map((sg) =>
    h('span', { class: 'lg-item' },
      h('span', { class: 'lg-box', style: { background: sg.color } }),
      h('span', null, sg.asset),
      h('span', { class: 'muted num' }, fmtPct(sg.value / total)))));
  container.appendChild(svg);
  container.appendChild(legend);
}

/* ================= 各股：成本 / 盈虧 直條圖 ================= */
function topRoundPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, h, w / 2));
  return 'M' + x + ' ' + (y + h) + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y +
    'H' + (x + w - r) + 'Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) + 'V' + (y + h) + 'Z';
}
function barLabel(b) {
  if (b.recovered) return b.bought > Engine.EPS ? '已回本' : '零成本';
  return fmtPct(b.pct, true);
}
function assetBarChart(container, allBars, o) {
  clear(container);
  const cur = o.cur;
  const pct = o.mode === 'pct';               // pct：每根以「累計買入」為 100%，方便比較不同大小的部位
  const bars = pct ? allBars.filter((b) => b.bought > Engine.EPS) : allBars;
  const K = (b) => (pct ? 1 / b.bought : 1);
  const n = bars.length;
  if (!n) { container.appendChild(h('p', { class: 'muted' }, '沒有可用「報酬率」表示的個股（零成本部位請切回金額檢視）。')); return; }
  const W = Math.max(container.clientWidth || 600, 260), H = 300;
  const m = { t: 30, r: 12, b: 32, l: pct ? 52 : (cur === 'TWD' ? 60 : 56) };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxH = Math.max.apply(null, bars.map((b) => b.height * K(b)));
  const nt = niceTicks(0, maxH > 0 ? maxH : 1, 5);
  const Y = (v) => m.t + ih - (v / nt.max) * ih;
  const slot = iw / n, bw = Math.min(40, slot * 0.6);
  const showLabels = slot >= 54;
  const tickText = (v) => (pct ? num(v * 100, 0, 0) + '%' : compact(v, cur));

  const svg = s('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'group', 'aria-label': '各股成本與盈虧直條圖' });
  nt.ticks.forEach((v, i) => {
    const y = Y(v);
    svg.appendChild(s('line', { class: i === 0 ? 'axis' : 'grid', x1: m.l, x2: W - m.r, y1: y, y2: y }));
    svg.appendChild(s('text', { class: 'tick', x: m.l - 8, y: y + 4, 'text-anchor': 'end' }, tickText(v)));
  });

  bars.forEach((b, i) => {
    const k = K(b);
    const cx = m.l + slot * (i + 0.5), x = cx - bw / 2;
    const segs = [];
    if (b.white > 0) segs.push({ kind: 'cost', v: b.white * k });
    if (b.profit > 0) segs.push({ kind: 'profit', v: b.profit * k });
    if (b.loss > 0) segs.push({ kind: 'loss', v: b.loss * k });
    const g = s('g', { class: 'bargrp' });
    let cursor = Y(0);
    segs.forEach((sg, j) => {
      const hpx = Math.max(2, (sg.v / nt.max) * ih);
      const top = cursor - hpx;
      const isTop = j === segs.length - 1;
      const y = top + (isTop ? 0 : 1);
      const hh = Math.max(1, hpx - (isTop ? 0 : 1) - (j > 0 ? 1 : 0));
      g.appendChild(s('path', { class: 'bar ' + sg.kind, d: isTop ? topRoundPath(x, y, bw, hh, 4) : 'M' + x + ' ' + y + 'h' + bw + 'v' + hh + 'h' + (-bw) + 'Z' }));
      cursor = top;
    });
    svg.appendChild(g);
    if (showLabels) svg.appendChild(s('text', { class: 'vlabel', x: cx, y: cursor - 7, 'text-anchor': 'middle' }, barLabel(b)));
    svg.appendChild(s('text', { class: 'xlabel', x: cx, y: H - 10, 'text-anchor': 'middle' }, b.asset));

    const hit = s('rect', {
      class: 'hit', x: m.l + slot * i, y: 0, width: slot, height: H - 20, tabindex: 0, role: 'img',
      'aria-label': b.asset + '：' + (b.recovered ? '已回本，' : '') + '目前市值 ' + fmtMoney(b.value, cur) + '，總損益 ' + fmtSigned(b.pnl, cur),
    });
    const show = (cx2, cy2) => {
      g.classList.add('hot');
      const rows = [h('div', { class: 'tip-head' }, b.asset + (b.recovered ? '　已取回成本' : ''))];
      rows.push(tipRow(null, '累計買入', fmtMoney(b.bought, cur), false));
      if (b.sold > 0) rows.push(tipRow(null, '已賣出回收', fmtMoney(b.sold, cur), false));
      if (b.white > 0 && !b.recovered) rows.push(tipRow('var(--cost-fill)', b.loss > 0 ? '剩餘市值（成本部分）' : '尚未取回成本', fmtMoney(b.white, cur), false));
      rows.push(tipRow(null, '目前市值', fmtMoney(b.value, cur), true));
      rows.push(tipRow(b.pnl >= 0 ? 'var(--st-good)' : 'var(--st-bad)', b.pnl >= 0 ? '盈利' : '虧損',
        fmtSigned(b.pnl, cur) + (b.pct != null ? '（' + fmtPct(b.pct, true) + '）' : ''), true));
      Tip.show(cx2, cy2, rows);
    };
    const hide = () => { g.classList.remove('hot'); Tip.hide(); };
    hit.addEventListener('pointermove', (e) => show(e.clientX, e.clientY));
    hit.addEventListener('pointerdown', (e) => show(e.clientX, e.clientY));
    hit.addEventListener('pointerleave', hide);
    hit.addEventListener('focus', () => { const r = hit.getBoundingClientRect(); show(r.left + r.width / 2, r.top + 40); });
    hit.addEventListener('blur', hide);
    svg.appendChild(hit);
  });

  const legend = h('div', { class: 'legend wrap' },
    h('span', { class: 'lg-item' }, h('span', { class: 'lg-box cost' }), '尚未取回的成本'),
    h('span', { class: 'lg-item' }, h('span', { class: 'lg-box', style: { background: 'var(--st-good)' } }), '盈利'),
    h('span', { class: 'lg-item' }, h('span', { class: 'lg-box', style: { background: 'var(--st-bad)' } }), '虧損'));
  container.appendChild(legend);
  container.appendChild(svg);
}

function cleanTiers(arr, def) {
  const nums = (Array.isArray(arr) ? arr : []).map((x) => Math.round((+x) * 100) / 100).filter((x) => isFinite(x) && x > 0);

function validTx(t) {
  if (!t || typeof t.id !== 'string' || !isFinite(t.ts) || Engine.TYPES.indexOf(t.type) < 0 || typeof t.asset !== 'string') return false;
  if (!(t.qty > 0 && isFinite(t.qty))) return false;
  if (!(t.price >= 0 && isFinite(t.price))) return false;
  return true;
}
function normalize(d) {
  const out = defaultData();
  d = d || {};
  Object.assign(out.settings, d.settings || {});
  const st = out.settings;
  st.method = st.method === 'fifo' ? 'fifo' : 'avg';
  st.order = cleanOrder(st.order);
  st.alertProfitTiers = cleanTiers(st.alertProfitTiers, [20, 50]);
  st.alertLossTiers = cleanTiers(st.alertLossTiers, [10, 20]);
  st.feeRate = st.feeRate >= 0 && st.feeRate < 0.2 ? +st.feeRate : 0.0025;
  st.minFee = st.minFee >= 0 ? +st.minFee : 0;
  st.sellFeeRate = st.sellFeeRate >= 0 && st.sellFeeRate < 0.2 ? +st.sellFeeRate : 0;
  st.fxManual = st.fxManual > 0 ? +st.fxManual : null;
  delete st.feeDiscount; delete st.oddMinFee;
  st.fmToken = typeof st.fmToken === 'string' ? st.fmToken.trim() : '';
  delete st.cur;
  const asRaw = d.alertState || {};
  for (const k in asRaw) {
    const v = asRaw[k];
    if (!v || typeof v !== 'object') continue;
    const pi = isFinite(v.profitIdx) ? Math.max(-1, Math.floor(v.profitIdx)) : -1;
    const li = isFinite(v.lossIdx) ? Math.max(-1, Math.floor(v.lossIdx)) : -1;
    out.alertState[k.toUpperCase()] = { profitIdx: pi, lossIdx: li };
  }
  out.alertLog = (Array.isArray(d.alertLog) ? d.alertLog : []).filter((e) =>
    e && typeof e.id === 'string' && typeof e.asset === 'string' && (e.kind === 'profit' || e.kind === 'loss') && isFinite(e.tier) && isFinite(e.ts)
  ).map((e) => ({ id: e.id, asset: e.asset.toUpperCase(), kind: e.kind, tier: +e.tier, ts: +e.ts, dismissed: !!e.dismissed })).slice(0, 50);
  out.txs = (Array.isArray(d.txs) ? d.txs : []).filter(validTx).map((t) => ({
    id: t.id, ts: +t.ts, type: t.type, asset: t.asset.toUpperCase(), qty: +t.qty, price: +t.price,
    fee: t.fee > 0 ? +t.fee : 0, tax: t.tax > 0 ? +t.tax : 0, fx: t.fx > 0 ? +t.fx : null,
    note: typeof t.note === 'string' ? t.note.slice(0, 200) : '',
    u: t.u > 0 ? +t.u : 0,
  }));
  for (const id in (d.deleted || {})) if (d.deleted[id] > 0) out.deleted[id] = +d.deleted[id];
  for (const k in (d.mpAt || {})) if (d.mpAt[k] > 0) out.mpAt[k.toUpperCase()] = +d.mpAt[k];
  const tp = d.targets || {};
  for (const k in tp) if (tp[k] > 0) out.targets[k.toUpperCase()] = +tp[k];
  for (const k in (d.targetAt || {})) if (d.targetAt[k] > 0) out.targetAt[k.toUpperCase()] = +d.targetAt[k];
  const ci = d.corpIgnored || {};
  for (const k in ci) if (ci[k]) out.corpIgnored[k] = 1;
  const sy = d.sync;
  if (sy && sy.owner && sy.repo && sy.token && sy.pw) out.sync = { owner: String(sy.owner), repo: String(sy.repo), token: String(sy.token), pw: String(sy.pw), path: SYNC_PATH };
  const mp = d.manualPrices || {};
  for (const k in mp) if (mp[k] > 0) out.manualPrices[k.toUpperCase()] = +mp[k];
  return out;
}

/* ---------- 匯率（美元兌台幣） ---------- */
/** ts 當天（或之前最近一個營業日）的匯率；沒有資料回傳 null */
function fxAt(ts) {
  const L = fx.list;
  if (!L.length || ts < L[0].day) return null;
  let lo = 0, hi = L.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (L[mid].day <= ts) lo = mid; else hi = mid - 1; }
  return L[lo].rate;
}
/** 目前匯率：牌告最新一筆 > 設定裡的手動匯率 > 最近一筆交易填的匯率 */
function fxNowInfo() {
  if (fx.list.length) { const l = fx.list[fx.list.length - 1]; return { rate: l.rate, src: 'live', date: l.date }; }
  if (data && data.settings.fxManual > 0) return { rate: data.settings.fxManual, src: 'manual' };
  if (data) { const ts = Engine.sortTx(data.txs).filter((t) => t.fx > 0); if (ts.length) return { rate: ts[ts.length - 1].fx, src: 'trade' }; }
  return null;
}
/** 某筆交易適用的匯率：自己填的 > 當天牌告 > 目前匯率 */
function txFx(t) {
  if (t.fx > 0) return t.fx;
  const r = fxAt(t.ts);
  if (r > 0) return r;
  const n = fxNowInfo();
  return n ? n.rate : null;
}
async function loadFx(force) {
  if (!session || fx.status === 'loading') return;
  let first = Date.now();
  for (const t of data.txs) if (t.ts < first) first = t.ts;
  const start = first - 15 * DAY;
  const fresh = fx.status === 'ready' && fx.at && Date.now() - fx.at < 3 * 3600000;
  if (!force && fresh && fx.start != null && fx.start <= start) return;
  fx.status = 'loading';
  let list = null, err = null;
  try { list = await Market.fetchFx(start); } catch (e) { err = e; }
  if (!session) return;
  if (list && list.length) { fx.list = list; fx.start = start; fx.status = 'ready'; fx.error = null; fx.at = Date.now(); }
  else { fx.status = 'error'; fx.error = err ? describeErr(err) : '查無匯率資料'; }
  renderLive();
}
/** 台幣視角：每筆交易用當時匯率換成台幣後重算一次（成本含匯差），市值用目前匯率 */
function computeTwd(method) {
  const now = fxNowInfo();
  if (!now) return null;
  const txs = [];
  for (const t of data.txs) {
    const f = txFx(t);
    if (!(f > 0)) return null;
    txs.push(Object.assign({}, t, { price: t.price * f, fee: (t.fee || 0) * f, tax: (t.tax || 0) * f }));
  }
  const res = Engine.replay(txs, { method });
  const sum = Engine.summarize(res, (a) => { const p = priceInfo(a); return p ? { price: p.price * now.rate, pct: p.pct, src: p.src, date: p.date } : null; });
  const byAsset = {};
  sum.rows.forEach((r) => { byAsset[r.asset] = r; });
  return { fx: now, summary: sum, byAsset };
}

let lastPxCache = { v: -1, map: {} };
function lastTradePx() {
  if (lastPxCache.v !== dataVersion) {
    const map = {};
    for (const t of Engine.sortTx(data.txs)) if (Engine.isTrade(t)) map[t.asset] = t.price;
    lastPxCache = { v: dataVersion, map };
  }
  return lastPxCache.map;
}
/** 價格資訊：收盤報價 > 手動 > 最近成交價 */
function priceInfo(asset) {
  const m = market.prices[asset];
  if (m && m.price > 0) return { price: m.price, pct: m.pct, src: 'live', date: m.date };
  const mp = data.manualPrices[asset];
  if (mp > 0) return { price: mp, pct: null, src: 'manual' };
  const lt = lastTradePx()[asset];
  if (lt > 0) return { price: lt, pct: null, src: 'trade' };
  return null;
}
function compute() {
  const cur = 'USD';
  const method = data.settings.method === 'fifo' ? 'fifo' : 'avg';
  const result = Engine.replay(data.txs, { method });
  const summary = Engine.summarize(result, (a) => priceInfo(a));
  const twd = computeTwd(method);
  summary.rows.forEach((r) => {
    const x = twd && twd.byAsset[r.asset];
    r.twdValue = x && x.value != null ? x.value : null;
    r.twdUnreal = x && x.unrealized != null ? x.unrealized : null;
  });
  lastC = { cur, fxNow: twd ? twd.fx.rate : null, method, result, summary, twd };
  applyAlertCheck(lastC);
  return lastC;
}

/* ---------- 訊號提醒（獲利/虧損跨門檻） ---------- */
function applyAlertCheck(C) {
